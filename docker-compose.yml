services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luxury_rental
    ports:
      - "5432:5432"
    volumes:
      - rental_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luxury_rental"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rental_postgres:
